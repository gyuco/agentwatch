<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>agentwatch · offices</title>
<link rel="icon" href="data:,">
<link rel="stylesheet" href="/style.css">
</head>
<body class="map">
<header>
  <div class="brand"><span class="logo"></span>agentwatch <span class="tag">hall</span></div>
  <span class="dot" id="conn"></span>
  <div class="meta" id="meta">…</div>
  <div class="spacer"></div>
  <button id="reload" title="reload the map">↻</button>
</header>
<main class="map-main">
  <div class="hallwrap">
    <div id="hall">
      <div class="ceiling"></div>
      <div class="wall"></div>
      <div class="floor"></div>
      <div class="molding"></div>
      <div class="chandelier">
        <div class="ch-glow"></div>
        <div class="ch-rod"></div>
        <div class="ch-arm a1"></div>
        <div class="ch-arm a2"></div>
        <div class="ch-flame f1"></div>
        <div class="ch-flame f2"></div>
        <div class="ch-flame f3"></div>
      </div>
      <div class="hall-title" aria-hidden="true">
        <span class="hall-title-mark"><i></i><i></i><i></i></span>
        <span class="hall-title-copy"><b>AGENTWATCH</b><small>PROJECT HALL</small></span>
      </div>
      <div class="wall-light wl-left" aria-hidden="true"><span></span></div>
      <div class="wall-light wl-right" aria-hidden="true"><span></span></div>
      <div class="hboard"><div class="hb-title">OFFICES</div><div class="hb-body" id="hbBody">…</div></div>
      <div class="sculpt scl1">
        <div class="ped"></div>
        <div class="marble">
          <div class="m-head">
            <div class="m-hair"></div>
            <div class="m-eye le"></div>
            <div class="m-eye re"></div>
            <div class="m-nose"></div>
            <div class="m-mouth"></div>
          </div>
          <div class="m-neck"></div>
          <div class="m-base"></div>
        </div>
      </div>
      <div class="sculpt scl2">
        <div class="ped"></div>
        <div class="marble">
          <div class="m-head">
            <div class="m-hair"></div>
            <div class="m-eye le"></div>
            <div class="m-eye re"></div>
            <div class="m-nose"></div>
            <div class="m-mouth"></div>
          </div>
          <div class="m-neck"></div>
          <div class="m-base"></div>
        </div>
      </div>
      <div class="mat">welcome</div>
      <div class="hdoors" id="hdoors"></div>
    </div>
  </div>
</main>
<div id="newModal">
  <div class="backdrop" id="newBackdrop"></div>
  <div class="nm-panel">
    <div class="nm-head">🏢 new office <span class="close-x" id="newClose" title="Close">✕</span></div>
    <div class="nm-field"><label for="ofName">name</label><input id="ofName" type="text" placeholder="e.g. acme" autocomplete="off"></div>
    <div class="nm-field">
      <label for="ofPath">local path</label>
      <div class="nm-path-row">
        <input id="ofPath" type="text" placeholder="e.g. ~/work/acme" autocomplete="off">
        <button id="pickPath" type="button" title="Choose project directory" aria-label="Choose project directory">…</button>
      </div>
    </div>
    <div class="nm-field">
      <label for="initPrompt">init prompt <span class="nm-detail">paste this into Claude to bootstrap the project</span></label>
      <div class="nm-path-row">
        <textarea id="initPrompt" readonly spellcheck="false" rows="6"></textarea>
        <button id="copyInitPrompt" type="button" title="Copy to clipboard" aria-label="Copy to clipboard">copy</button>
      </div>
    </div>
    <div id="workflowSetup" hidden>
      <p class="nm-warning" id="workflowNotice"></p>
      <div class="nm-field">
        <label for="setupPack">setup pack</label>
        <select id="setupPack"></select>
        <span class="nm-detail" id="packDescription"></span>
      </div>
      <div class="catalog-grid">
        <fieldset><legend>agents</legend><div id="catalogAgents"></div></fieldset>
        <fieldset><legend>skills</legend><div id="catalogSkills"></div></fieldset>
        <fieldset><legend>MCP</legend><div id="catalogMcps"></div></fieldset>
      </div>
      <div class="nm-field">
        <label for="catalogWorkflow">workflow</label>
        <select id="catalogWorkflow"></select>
        <span class="nm-detail" id="workflowDescription"></span>
      </div>
      <div class="nm-field"><label for="workflowConfig">workflow configuration</label><textarea id="workflowConfig" spellcheck="false"></textarea></div>
      <button id="overwriteWorkflow" type="button">overwrite existing config with selected workflow</button>
    </div>
    <p class="nm-hint" id="newHint"></p>
    <button id="newOk">create office</button>
  </div>
</div>
<script src="/map.js"></script>
</body>
</html>
